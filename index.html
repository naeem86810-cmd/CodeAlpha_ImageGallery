<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CodeAlpha Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📸 My Image Gallery</h1>
        <p>Explore beautiful images</p>
    </header>
<div class="search-box">
    <input 
        type="text" 
        id="searchInput" 
        placeholder="🔍 Search images..."
    >
</div>
    <div class="filters">

        <button class="filter-btn active" data-filter="all">
            All
        </button>

        <button class="filter-btn" data-filter="nature">
            Nature
        </button>

        <button class="filter-btn" data-filter="animals">
            Animals
        </button>

        <button class="filter-btn" data-filter="city">
            City
        </button>

    </div>
<div class="gallery">

    <div class="gallery-item" data-category="nature">
        <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=800&q=80" alt="Nature Image">
        <div class="caption">
            Beautiful Nature
            <button class="like-btn">♡</button>
        </div>
    </div>

    <div class="gallery-item" data-category="animals">
        <img src="https://images.unsplash.com/photo-1549366021-9f761d450615?auto=format&fit=crop&w=800&q=80" alt="Animal Image">
        <div class="caption">
            Amazing Animals
            <button class="like-btn">♡</button>
        </div>
    </div>

    <div class="gallery-item" data-category="city">
        <img src="https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?auto=format&fit=crop&w=800&q=80" alt="City Image">
        <div class="caption">
            Modern City
            <button class="like-btn">♡</button>
        </div>
    </div>

    <div class="gallery-item" data-category="nature">
        <img src="https://images.unsplash.com/photo-1501854140801-50d01698950b?auto=format&fit=crop&w=800&q=80" alt="Nature Image">
        <div class="caption">
            Natural Beauty
            <button class="like-btn">♡</button>
        </div>
    </div>

    <div class="gallery-item" data-category="animals">
        <img src="https://images.unsplash.com/photo-1557050543-4d5f4e07ef46?auto=format&fit=crop&w=800&q=80" alt="Animal Image">
        <div class="caption">
            Wildlife
            <button class="like-btn">♡</button>
        </div>
    </div>

    <div class="gallery-item" data-category="city">
        <img src="https://images.unsplash.com/photo-1514565131-fce0801e5785?auto=format&fit=crop&w=800&q=80" alt="City Image">
        <div class="caption">
            City Life
            <button class="like-btn">♡</button>
        </div>
    </div>

</div>
    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">

        <button class="close" id="close">&times;</button>

        <button class="prev" id="prev">&#10094;</button>

        <img id="lightbox-img" src="" alt="">

        <button class="next" id="next">&#10095;</button>

    </div>

    <footer>
        <p>© 2026 CodeAlpha Image Gallery</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
